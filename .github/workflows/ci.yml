name: CI

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile production modules
        run: python -m compileall -q -x '^\./\.venv/' .
      - name: Run offline regression suite
        run: python -m pytest tests/ -q
      # Тесты не должны зависеть от data/: каталог в .gitignore, в чистом
      # клоне его нет. Раньше один тест читал data/manual_labels.csv и падал
      # только в CI — проверяем это явно, а не надеемся, что не повторится.
      - name: Suite must not read gitignored data
        run: |
          if grep -rnE '(Path|open|read_csv|read_text|copy|copyfile)\(\s*"data/' tests/; then
            echo "Тест ЧИТАЕТ файл из data/ — в чистом клоне его нет"; exit 1
          fi
