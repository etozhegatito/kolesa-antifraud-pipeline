name: CI

on:
  push:
  pull_request:

jobs:
  # Раньше назывался offline-tests и это было правдой: база не поднималась,
  # и весь SQL проекта в CI не исполнялся ни разу.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    # Настоящий Postgres, потому что без него ни один запрос проекта не
    # исполнялся в CI ни разу: сломанный JOIN или разъехавшаяся с кодом схема
    # обнаруживались только на машине разработчика. Имя базы «test» — не
    # косметика: тесты отказываются работать с базой, в имени которой этого
    # слова нет, чтобы прогон не затёр собранные данные (см.
    # tests/test_integration_db.py).
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Та же версия, что в локальном .venv, и это обязательное условие,
          # а не совпадение. Версии в requirements.txt зафиксированы ТОЧНО,
          # чтобы метрики были повторяемы, — а точный пин привязан к версии
          # Python: numpy 2.5 не существует для 3.11, и CI падал на установке,
          # пока здесь стояло 3.11 против локальных 3.13.
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tooling
        run: pip install ruff==0.16.4 coverage==7.6.12
      - name: Compile production modules
        run: python -m compileall -q -x '^\./\.venv/' .

      # Ловит то, что иначе всплывает только при запуске: неопределённые
      # имена, забытые импорты, изменяемый аргумент по умолчанию. За одну
      # сессию мы трижды писали тест с неопределённым именем и узнавали об
      # этом от pytest — линтер сообщает за секунду.
      - name: Lint
        run: ruff check kz/ tests/ airflow/
      # Порог, а не цель. Смысл не в том, чтобы догнать до 90%, а в том,
      # чтобы новый код приходил с тестами и покрытие не сползало вниз.
      - name: Run regression suite with coverage
        run: |
          coverage run --source=kz -m pytest tests/ -q
          coverage report --skip-covered --sort=cover
          coverage report --fail-under=39

      # Интеграционные тесты умеют пропускаться, когда базы нет — это нужно
      # локально. Здесь база есть, и пропуск означал бы, что мы подняли
      # сервис Postgres и ничего им не проверили. Сами тесты падают при
      # CI=true, но эта переменная задаётся окружением, а не нами, поэтому
      # проверяем результат ещё и снаружи.
      - name: Database tests must run, not skip
        run: |
          out=$(python -m pytest tests/test_integration_db.py -q 2>&1 | tail -1)
          echo "$out"
          case "$out" in
            *skipped*|*"no tests ran"*)
              echo "Тесты с базой не выполнились — Postgres не подхватился"
              exit 1 ;;
          esac
      # Тесты не должны зависеть от data/: каталог в .gitignore, в чистом
      # клоне его нет. Раньше один тест читал data/manual_labels.csv и падал
      # только в CI — проверяем это явно, а не надеемся, что не повторится.
      - name: Suite must not read gitignored data
        run: |
          if grep -rnE '(Path|open|read_csv|read_text|copy|copyfile)\(\s*"data/' tests/; then
            echo "Тест ЧИТАЕТ файл из data/ — в чистом клоне его нет"; exit 1
          fi

  web-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install web dependencies
        run: pip install -r requirements-web.txt
      - name: Create non-production smoke artifact
        run: python -m kz.ops.create_smoke_artifact --output .ci-smoke/models
      - name: Build container and check model health
        run: |
          docker build \
            --build-arg MODEL_DIR=.ci-smoke/models \
            --tag kz-auto-market-intelligence:ci .
          docker run --detach --name kz-ami-smoke \
            --publish 18000:8000 --env KZ_PUBLIC_DEMO=1 \
            kz-auto-market-intelligence:ci
          trap 'docker logs kz-ami-smoke; docker rm --force kz-ami-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/api/health \
              | grep --quiet '"ok":true'; then
              exit 0
            fi
            sleep 2
          done
          echo "Web container did not become healthy"
          exit 1
