name: CI

on:
  push:
  pull_request:

jobs:
  # This job once ran without a database, so the project's SQL was never
  # exercised in CI. PostgreSQL is now part of the contract.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    # A real PostgreSQL service catches broken joins and schema/code drift.
    # The database name must contain "test": integration tests refuse to touch
    # any other database so they cannot overwrite collected data.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the local training environment. Exact dependency pins are
          # Python-version-specific and protect metric reproducibility.
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tooling
        run: pip install ruff==0.16.4 coverage==7.6.12
      - name: Compile production modules
        run: python -m compileall -q -x '^\./\.venv/' .

      # Catch undefined names, missing imports, and unsafe defaults early.
      - name: Lint
        run: ruff check kz/ tests/ airflow/
      # This is a regression floor, not a vanity coverage target.
      - name: Run regression suite with coverage
        run: |
          coverage run --source=kz -m pytest tests/ -q
          coverage report --skip-covered --sort=cover
          coverage report --fail-under=39

      # Integration tests may skip locally when PostgreSQL is absent. In CI,
      # any skip means the database contract was not tested and must fail.
      - name: Database tests must run, not skip
        run: |
          out=$(python -m pytest tests/test_integration_db.py -q 2>&1 | tail -1)
          echo "$out"
          case "$out" in
            *skipped*|*"no tests ran"*)
              echo "Database tests did not run; PostgreSQL was not detected"
              exit 1 ;;
          esac
      # Tests must not read gitignored source data that a clean clone lacks.
      - name: Suite must not read gitignored data
        run: |
          if grep -rnE '(Path|open|read_csv|read_text|copy|copyfile)\(\s*"data/' tests/; then
            echo "A test reads data/ even though a clean clone does not contain it"; exit 1
          fi

  web-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install web dependencies
        run: pip install -r requirements-web.txt
      - name: Create non-production smoke artifact
        run: python -m kz.ops.create_smoke_artifact --output .ci-smoke/models
      - name: Build container and check model health
        run: |
          docker build \
            --build-arg MODEL_DIR=.ci-smoke/models \
            --tag kz-auto-market-intelligence:ci .
          docker run --detach --name kz-ami-smoke \
            --publish 18000:8000 --env KZ_PUBLIC_DEMO=1 \
            kz-auto-market-intelligence:ci
          trap 'docker logs kz-ami-smoke; docker rm --force kz-ami-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/api/health \
              | grep --quiet '"ok":true'; then
              exit 0
            fi
            sleep 2
          done
          echo "Web container did not become healthy"
          exit 1
