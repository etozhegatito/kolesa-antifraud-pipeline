name: CI

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Та же версия, что в локальном .venv, и это обязательное условие,
          # а не совпадение. Версии в requirements.txt зафиксированы ТОЧНО,
          # чтобы метрики были повторяемы, — а точный пин привязан к версии
          # Python: numpy 2.5 не существует для 3.11, и CI падал на установке,
          # пока здесь стояло 3.11 против локальных 3.13.
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dev tooling
        run: pip install ruff==0.16.4 coverage==7.6.12
      - name: Compile production modules
        run: python -m compileall -q -x '^\./\.venv/' .

      # Ловит то, что иначе всплывает только при запуске: неопределённые
      # имена, забытые импорты, изменяемый аргумент по умолчанию. За одну
      # сессию мы трижды писали тест с неопределённым именем и узнавали об
      # этом от pytest — линтер сообщает за секунду.
      - name: Lint
        run: ruff check kz/ tests/ airflow/
      # Порог, а не цель. Смысл не в том, чтобы догнать до 90%, а в том,
      # чтобы новый код приходил с тестами и покрытие не сползало вниз.
      - name: Run offline regression suite with coverage
        run: |
          coverage run --source=kz -m pytest tests/ -q
          coverage report --skip-covered --sort=cover
          coverage report --fail-under=38
      # Тесты не должны зависеть от data/: каталог в .gitignore, в чистом
      # клоне его нет. Раньше один тест читал data/manual_labels.csv и падал
      # только в CI — проверяем это явно, а не надеемся, что не повторится.
      - name: Suite must not read gitignored data
        run: |
          if grep -rnE '(Path|open|read_csv|read_text|copy|copyfile)\(\s*"data/' tests/; then
            echo "Тест ЧИТАЕТ файл из data/ — в чистом клоне его нет"; exit 1
          fi
