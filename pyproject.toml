# Machine-readable project contract and Ruff configuration. requirements*.txt
# pins libraries; requires-python prevents installation on an incompatible VM.

[project]
name = "kz-auto-market-intelligence"
version = "0.1.0"
description = "Automotive market intelligence, price estimation and anomaly review for Kazakhstan"
requires-python = ">=3.13,<3.14"

[tool.ruff]
target-version = "py313"        # Matches CI and the local training environment.
line-length = 100
exclude = [".venv", "__pycache__", "docs"]

[tool.ruff.lint]
# Deliberately narrow: rules that catch defects rather than formatting.
#
#   F   pyflakes: undefined names, unused imports, and empty f-strings.
#   E9  syntax and parser/runtime failures.
#   B   flake8-bugbear: mutable defaults, captured loop variables, and unsafe
#       exception handling.
#
# Style-only rules are intentionally disabled. Ruff is a defect guard here,
# not a formatting policy.
select = ["F", "E9", "B"]

# B905 (zip without strict=) is enabled only for tests. A silently shortened
# comparison can hide a missing row. Production uses remain documented debt
# where same-length DataFrame columns are already guaranteed.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally import inside functions to keep each dependency local.
"tests/*" = ["B011"]
# Tests must use strict=; see the rationale above.
"tests/test_pipeline.py" = ["B011"]
