# Конфигурация ruff. Отдельного пакета проект не собирает — этот файл
# существует только ради настроек линтера.

[tool.ruff]
target-version = "py313"        # та же, что в CI и в локальном .venv
line-length = 100
exclude = [".venv", "__pycache__", "docs"]

[tool.ruff.lint]
# Осознанно узкий набор: правила, которые ловят ОШИБКИ, а не оформление.
#
#   F   pyflakes — неопределённые имена, неиспользуемые импорты, f-строки
#       без подстановок. Именно это трижды за одну сессию всплывало у нас
#       уже во время прогона тестов, хотя ловится за секунду.
#   E9  синтаксические и runtime-ошибки разбора.
#   B   flake8-bugbear — настоящие ловушки: изменяемый аргумент по умолчанию,
#       переменная цикла, захваченная замыканием, except без повторного
#       возбуждения.
#
# Стилевые правила (длина строк, порядок импортов, кавычки) намеренно НЕ
# включены: они дали бы 189 замечаний и утопили бы полезные в шуме. Здесь
# линтер — предохранитель, а не редактор.
select = ["F", "E9", "B"]

# B905 (zip без strict=) включён ТОЛЬКО для тестов, и это осознанно.
# В тесте молча укоротившийся zip — это утечка строгости: сравнение
# «до и после» перестаёт замечать пропавшую строку, и тест не может упасть.
# В остальном коде десять таких мест зипуют заведомо равные колонки одного
# DataFrame; проставлять там strict= сейчас значит трогать рабочую логику
# ради формальности. Долг записан, не спрятан.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Тесты намеренно импортируют внутри функций — так виднее, что именно
# проверяется, и модуль не тянется при сборе тестов.
"tests/*" = ["B011"]
# в тестах strict= обязателен — см. комментарий выше
"tests/test_pipeline.py" = ["B011"]
