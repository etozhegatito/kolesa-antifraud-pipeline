services:
  postgres:
    image: postgres:15-alpine
    container_name: market_db_container
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # PostgreSQL applies these files alphabetically on the first start with
      # an empty volume, so a clean clone needs no manual psql command.
      - ./sql/init:/docker-entrypoint-initdb.d:ro

  # Price-estimation web service. This is the cloud image plus a local database
  # for comparable cars. It starts only when requested so normal pipeline work
  # does not rebuild the image:
  #     docker compose --profile web up -d --build
  # Then open http://localhost:8000.
  web:
    build: .
    profiles: ["web"]
    depends_on:
      - postgres
    environment:
      # Inside the Compose network, use the service name rather than localhost.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Local development keeps labeling enabled, so public mode stays off.
      KZ_PUBLIC_DEMO: "0"
    ports:
      - "8000:8000"
    volumes:
      # Photos and label journals stay on the host and never enter the image.
      - ./data/photos:/app/data/photos:ro
      - ./data/manual_labels.csv:/app/data/manual_labels.csv

  # Airflow portfolio layer, not the default execution path. Start it only with
  # `docker compose --profile airflow up -d`. Its metadata database is isolated
  # from the project's raw_ads/clean_data schema.
  airflow-postgres:
    image: postgres:15-alpine
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data

  airflow-init:
    build: {context: ., dockerfile: airflow/Dockerfile}
    profiles: ["airflow"]
    depends_on:
      - airflow-postgres
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      # DAG tasks connect container-to-container, not through localhost.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate &&
          airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/project

  airflow-webserver:
    build: {context: ., dockerfile: airflow/Dockerfile}
    profiles: ["airflow"]
    depends_on:
      - airflow-init
      - postgres
    environment: *airflow-env
    ports:
      - "8080:8080"
    command: webserver
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/project

  airflow-scheduler:
    build: {context: ., dockerfile: airflow/Dockerfile}
    profiles: ["airflow"]
    depends_on:
      - airflow-init
      - postgres
    environment: *airflow-env
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/project

volumes:
  pgdata:
  airflow_pgdata:
