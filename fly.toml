# Optional Fly.io deployment configuration.
#
# Render is the primary free demo host and reads render.yaml. This file remains
# as a portable alternative for deploying the same Docker image with Fly.io.
#
# First deployment:
#     fly launch --no-deploy --copy-config --name kz-price
#     fly deploy
# Update after retraining:
#     fly deploy
#
# The app name also becomes the kz-price.fly.dev subdomain.
app = "kz-price"
primary_region = "waw"        # Warsaw is the closest available Fly region.

[build]
  dockerfile = "Dockerfile"

[env]
  # Expose estimation only. Anonymous access must never mutate ground truth.
  KZ_PUBLIC_DEMO = "1"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  # Sleep while idle and wake on the first request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "40s"       # Allow CatBoost artifacts to load.
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  # One gigabyte leaves comfortable headroom for CatBoost, pandas, and NumPy.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
